<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 페이지</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:src="@{/js/motion.js}"></script>
</head>
<body>
    <header th:replace="~{layout/header :: header}"></header>
    <main>
        <section id="signup">
            <form th:action="@{/user/signup}" method="post">
                <table>
                    <thead>
                        <tr><th colspan="2"><h2>회원가입</h2></th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><label for="username">아이디</label></td>
                            <td><input type="text" id="username" name="username" required></td>
                        </tr>
                        <tr>
                            <td><label for="password">비밀번호</label></td>
                            <td><input type="password" id="password" name="password" required></td>
                        </tr>
                        <tr>
                            <td><label for="nickname">닉네임</label></td>
                            <td><input type="text" id="nickname" name="nickname" required></td>
                        </tr>
                        <tr><td colspan="2"><button type="submit">회원가입</button></td></tr>
                        <tr><td colspan="2"><a th:href="@{/user/login}">계정이 없으신가요? 로그인</a></td></tr>
                        </tbody>
                    </table>
                </form>
            </section>
            <div th:if="${error}">
                <p th:text="${error}"></p>
            </div>
        </main>
    </body>
</html>
