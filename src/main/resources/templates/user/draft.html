<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>임시 저장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:src="@{/js/motion.js}"></script>
</head>
<body>
    <header th:replace="~{layout/header :: header}"></header>
    <main>
        <h3>임시 저장 목록</h3>

        <p>total : <span th:text="${draftPage.totalElements}"></span></p>
        <table class="post-list">
            <tbody>
            <tr th:each="post, iterStat : ${draftPage.content}">
                <td>
                    <a th:href="@{/post/write(id=${post.id})}" th:text="${post.title}"></a>
                </td>
                <td th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
        <div class="pagination">
        <span>
            <a th:href="@{/user/draft(id=${profileUser.id}, page=0)}">처음</a>
        </span>
            <span>
            <a th:href="@{/user/draft(id=${profileUser.id}, page=${(draftPage.number-5<0)?0:draftPage.number-5})}">이전</a>
        </span>
            <span th:if="${draftPage.totalPages}>0"
                  th:each="i : ${#numbers.sequence(draftPage.number-draftPage.number%5, draftPage.number-draftPage.number%5+4>draftPage.getTotalPages()-1?draftPage.getTotalPages()-1:draftPage.number-draftPage.number%5+4)}">
            <a th:href="@{/user/draft(id=${profileUser.id}, page=${i})}"
               th:text="${i+1}"
               class="page-num"
               th:classappend="${i==draftPage.number?'active':''}">
            </a>
        </span>
            <span>
            <a th:href="@{/user/draft(id=${profileUser.id}, page=${(draftPage.number+5>draftPage.getTotalPages()-1)?draftPage.getTotalPages()-1:draftPage.number+5})}">다음</a>
        </span>
            <span>
            <a th:href="@{/user/draft(id=${profileUser.id}, page=${draftPage.getTotalPages()-1})}">끝</a>
        </span>
        </div>
        <a th:href="@{/post/write}">뒤로가기</a>
        <a th:href="@{/post}">목록</a>
    </main>
</body>
</html>
