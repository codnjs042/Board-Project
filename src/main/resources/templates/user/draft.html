<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>임시 저장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:src="@{/js/motion.js}"></script>
</head>
<body>
    <header th:replace="~{layout/header :: header}"></header>
    <main>
        <h3>임시 저장 목록</h3>

        <p>total : <span th:text="${draftPage.totalElements}"></span></p>
        <table class="post-list">
            <tbody>
            <tr th:each="post, iterStat : ${draftPage.content}">
                <td>
                    <a th:href="@{/post/write(id=${post.id})}" th:text="${post.title}"></a>
                </td>
                <td th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
        <div class="pagination">
        <span th:if="${draftPage.hasPrevious()}">
            <a th:href="@{/user/draft(page=${draftPage.number-1})}">이전</a>
        </span>
            <span th:if="${draftPage.totalPages}>0"
                  th:each="i : ${#numbers.sequence(0, draftPage.totalPages-1)}">
            <a th:href="@{/user/draft(page=${i}, keyword=${keyword})}"
               th:text="${i+1}"
               th:classappend="${i==draftPage.number ? 'active' : ''}">
            </a>
        </span>
            <span th:if="${draftPage.hasNext()}">
            <a th:href="@{/user/draft(page=${draftPage.number+1})}">다음</a>
        </span>
        </div>
        <a th:href="@{/post/write}">뒤로가기</a>
        <a th:href="@{/post}">목록</a>
    </main>
</body>
</html>
