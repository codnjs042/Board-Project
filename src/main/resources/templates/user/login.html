<!DOCTYPE html>
<!--<html lang="en">-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="layout/header :: header"></header>
    <main>
        <section id="login">
            <form th:action="@{/user/login}" method="post">
            <table>
                <thead>
                    <tr><th colspan="3"><h2>로그인</h2></th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td><label for="username">아이디</label></td>
                        <td><input type="text" id="username" name="username" required tabindex="1"></td>
                        <td rowspan="2"><button type="submit" tabindex="3">로그인</button></td>
                    </tr>
                    <tr>
                        <td><label for="password">비밀번호</label></td>
                        <td><input type="password" id="password" name="password" required tabindex="2"></td>
                    </tr>
                    <tr><td colspan="3"><a th:href="@{/user/signup}" tabindex="4">계정이 없으신가요? 회원가입</a></td></tr>
                    <tr>
                        <td colspan="3">
                            <a th:href="@{|https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${kakao.clientId}&redirect_uri=${kakao.redirectUri}|}" tabindex="5">
                                <img src="/img/kakao_login.png" alt="카카오 로그인">
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
            </form>
        </section>
        <div th:if="${param.error}">
            <p>아이디 또는 비밀번호가 올바르지 않습니다</p>
        </div>
        <div th:if="${error}">
            <p th:text="${error}"></p>
        </div>
    </main>
</body>
</html>
