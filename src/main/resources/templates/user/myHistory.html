<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>마이페이지</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header th:replace="layout/header :: header"></header>
        <main id="myHistory" class="myPages">
            <div>
                <h2>마이페이지</h2>
            </div>
            <div>
                <nav>
                    <ul>
                        <li><a th:href="@{/user/myPage}">회원 정보 변경</a></li>
                        <li><a th:href="@{/user/myHistory}">유저 활동 내역</a></li>
                        <li><a th:href="@{/user/delete}">계정 삭제</a></li>
                    </ul>
                </nav>
                <section>

                <p><span th:text="${user.nickname}"></span>님의 활동</p>
                <p>total : <span th:text="${postPage.totalElements}"></span></p>
                <table class="post-list">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="post, iterStat : ${postPage.content}">
                        <th th:if="${post.type.name() == 'NOTICE' and #strings.isEmpty(param.keyword)}" th:text="'<공지>'"></th>
                        <th th:unless="${post.type.name() == 'NOTICE' and #strings.isEmpty(param.keyword)}" th:text="${postPage.totalElements-postPage.number*postPage.size-iterStat.index}"></th>
                        <td>
                            <a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}"></a>
                        </td>
                        <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <span th:if="${postPage.hasPrevious()}">
                        <a th:href="@{/user/myHistory(page=${postPage.number-1})}">이전</a>
                    </span>
                    <span th:if="${postPage.totalPages}>0"
                          th:each="i : ${#numbers.sequence(0, postPage.totalPages-1)}">
                        <a th:href="@{/user/myHistory(page=${i}, keyword=${keyword})}"
                           th:text="${i+1}"
                           th:classappend="${i==postPage.number ? 'active' : ''}">
                        </a>
                    </span>
                    <span th:if="${postPage.hasNext()}">
                        <a th:href="@{/user/myHistory(page=${postPage.number+1})}">다음</a>
                    </span>
                </div>

                <form th:action="@{/user/myHistory}" method="get">
                    <select name="type">
                        <option value="title">제목</option>
                        <option value="content">내용</option>
                    </select>
                    <input type="text" name="keyword" placeholder="검색어를 입력하세요" th:value="${keyword}"/>
                    <button type="submit">검색</button>
                </form>

                </section>
            </div>
        </main>
    </body>
</html>
